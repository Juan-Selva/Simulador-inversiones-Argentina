[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulador-inversiones"
version = "0.1.0"
description = "Simulador de inversiones con datos argentinos (plazo fijo, dólar, UVA) ajustado por inflación"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]
dev = ["pytest>=8"]

[project.scripts]
simulador = "simulador.cli:app"
simulador-gui = "simulador.interfaz.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
